<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8bc7f"/>
      <stop offset="100%" stop-color="#e27d24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Rounded squircle container with dark navy-canvas gradient and amber hairline border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#f2a65a" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- TeX mark: T (white), dropped E (amber), X (white) with subtle shadow -->
  <g filter="url(#glow)">
    <text x="8" y="20.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#f5f6f6">T</text>
    <text x="16" y="24" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="700" fill="url(#amber)">E</text>
    <text x="24" y="20.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#f5f6f6">X</text>
  </g>
</svg>

